<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1B2A6B" flood-opacity="0.16"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="24" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F7F3E8"/>
    </linearGradient>
    <linearGradient id="box-side-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2DCD0"/>
      <stop offset="100%" stop-color="#CCC4B4"/>
    </linearGradient>
    <linearGradient id="bottle-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#542B08"/>
      <stop offset="25%" stop-color="#8E490D"/>
      <stop offset="60%" stop-color="#B86214"/>
      <stop offset="85%" stop-color="#733808"/>
      <stop offset="100%" stop-color="#3A1C03"/>
    </linearGradient>
    <linearGradient id="orange-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="mango-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#233588"/>
      <stop offset="100%" stop-color="#141E4D"/>
    </linearGradient>
    <linearGradient id="surface-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow & Ground Shadow -->
  <ellipse cx="300" cy="580" rx="240" ry="24" fill="url(#surface-glow)"/>
  <ellipse cx="230" cy="585" rx="140" ry="16" fill="#1B2A6B" opacity="0.12"/>
  <ellipse cx="430" cy="588" rx="90" ry="12" fill="#1B2A6B" opacity="0.10"/>

  <!-- PRODUCT CARTON BOX (LEFT / CENTER) -->
  <g filter="url(#drop-shadow)">
    <!-- Box Side (Perspective 3D) -->
    <path d="M 80,120 L 145,85 L 145,530 L 80,565 Z" fill="url(#box-side-grad)"/>
    <!-- Side details -->
    <text x="-340" y="112" transform="rotate(-90)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#5A5243" letter-spacing="1.5">MANGOVITA KIDS 100 ML</text>
    <rect x="94" y="240" width="36" height="60" rx="3" fill="#D5CBB9" opacity="0.6"/>
    <!-- Box Top Flap -->
    <path d="M 80,120 L 145,85 L 340,85 L 275,120 Z" fill="#FDFBF7"/>

    <!-- Box Front Face -->
    <path d="M 145,85 L 340,85 L 340,530 L 145,530 Z" fill="url(#box-grad)" stroke="#EADFCB" stroke-width="1.5"/>

    <!-- Box Header Wave / Ribbon -->
    <path d="M 145,85 L 340,85 L 340,165 Q 240,140 145,170 Z" fill="url(#navy-grad)"/>

    <!-- Sugar Free Strip -->
    <path d="M 145,85 L 260,85 L 245,115 L 145,115 Z" fill="url(#orange-badge)"/>
    <text x="155" y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1">SUGAR FREE</text>

    <!-- FSSAI small logo mark -->
    <text x="325" y="105" text-anchor="end" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#E2E8F0">fssai</text>

    <!-- Kids Variant Pill Badge -->
    <g transform="translate(160, 130)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="url(#mango-yellow)"/>
      <!-- Running Boy Icon (Silhouette) -->
      <path d="M 14,7 C 15.2,7 16,6.2 16,5 C 16,3.8 15.2,3 14,3 C 12.8,3 12,3.8 12,5 C 12,6.2 12.8,7 14,7 Z M 19,8 L 16,8 L 14.5,10.5 L 12.5,9.5 L 14.5,7.2 C 14.2,6.8 13.8,6.5 13.2,6.5 C 12.6,6.5 12,6.8 11.5,7.5 L 9,10.5 L 10.5,11.5 L 12,10 L 12,14 L 14,17 L 15.5,16 L 14,13 L 15,11 L 18,12 L 19,8 Z" fill="#141E4D"/>
      <text x="24" y="15" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800" fill="#141E4D" letter-spacing="0.5">FOR KIDS</text>
    </g>

    <!-- 100 ml Badge -->
    <rect x="290" y="130" width="38" height="20" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text x="309" y="144" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#141E4D">100 ml</text>

    <!-- Brand Name: Mangovita -->
    <text x="160" y="210" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#1B2A6B" letter-spacing="-0.5">Mangovita<tspan font-size="12" dy="-14">™</tspan></text>

    <!-- SYRUP Pill Badge -->
    <g transform="translate(160, 222)">
      <rect x="0" y="0" width="72" height="18" rx="9" fill="url(#orange-badge)"/>
      <text x="36" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">SYRUP</text>
    </g>
    <!-- Flavor indicator -->
    <text x="240" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#F5730E">Delicious Mango</text>

    <!-- Formula Highlights Line -->
    <foreignObject x="160" y="248" width="165" height="42">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 8px; line-height: 1.35; color: #4A5568; font-weight: 600;">
        L-Lysine HCl, L-Arginine, L-Carnitine, Choline, Taurine, Zinc &amp; Multivitamins
      </div>
    </foreignObject>

    <!-- Mango Illustration Art on Box -->
    <g transform="translate(245, 290)">
      <!-- Mango Fruit -->
      <path d="M 30,10 C 60,10 75,35 70,65 C 65,90 40,105 15,95 C -5,85 -5,55 5,30 C 12,12 20,10 30,10 Z" fill="url(#mango-yellow)"/>
      <path d="M 32,15 C 55,20 65,42 60,68 C 52,90 32,95 20,88 C 45,78 48,35 32,15 Z" fill="#F5730E" opacity="0.6"/>
      <!-- Mango Leaf -->
      <path d="M 30,10 C 25,-8 10,-14 0,-16 C 4,-2 10,4 25,8 Z" fill="#2E7D32"/>
      <!-- Small Blossom -->
      <circle cx="28" cy="10" r="3" fill="#8D6E63"/>
    </g>

    <!-- Benefit Checkpoints Box -->
    <g transform="translate(155, 300)">
      <!-- Benefit 1 -->
      <circle cx="8" cy="8" r="7" fill="#EBF4FF"/>
      <path d="M 5,8 L 7,10 L 11,6" stroke="#1B2A6B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="20" y="11" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#1B2A6B">Growth &amp; Strength</text>

      <!-- Benefit 2 -->
      <circle cx="8" cy="28" r="7" fill="#FEF3C7"/>
      <path d="M 5,28 L 7,30 L 11,26" stroke="#D97706" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="20" y="31" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#1B2A6B">Immunity Defense</text>

      <!-- Benefit 3 -->
      <circle cx="8" cy="48" r="7" fill="#FFEDD5"/>
      <path d="M 5,48 L 7,50 L 11,46" stroke="#EA580C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="20" y="51" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#1B2A6B">Energy &amp; Alertness</text>

      <!-- Benefit 4: Appetite (भूख) -->
      <rect x="0" y="65" width="115" height="18" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
      <text x="6" y="77" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#92400E">Appetite (भूख बढ़ाने वाला)</text>
    </g>

    <!-- Box Footer Banner -->
    <path d="M 145,465 L 340,465 L 340,530 L 145,530 Z" fill="url(#navy-grad)"/>
    <text x="242" y="488" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#FFD13B">HEALTH SUPPLEMENT FOR CHILDREN</text>
    <text x="242" y="505" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="600" fill="#CBD5E1">Nutraceutical • Not for medicinal use</text>
    <!-- Kenas Logo Mark on Box -->
    <text x="242" y="521" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1">KENAS LABS</text>
  </g>

  <!-- PRODUCT BOTTLE (RIGHT / OVERLAPPING) -->
  <g filter="url(#drop-shadow)" transform="translate(320, 160)">
    <!-- Bottle Cap & Measuring Cup -->
    <g transform="translate(50, 0)">
      <!-- Measuring Cup (Clear translucent) -->
      <path d="M 8,0 L 42,0 L 46,35 L 4,35 Z" fill="#E2E8F0" opacity="0.65" stroke="#94A3B8" stroke-width="1.2"/>
      <line x1="8" y1="12" x2="18" y2="12" stroke="#64748B" stroke-width="1"/>
      <text x="22" y="14" font-family="Arial" font-size="6" fill="#475569">5ml</text>
      <line x1="6" y1="22" x2="20" y2="22" stroke="#64748B" stroke-width="1"/>
      <text x="24" y="24" font-family="Arial" font-size="6" fill="#475569">10ml</text>
      <!-- Cap (White Ribbed) -->
      <rect x="10" y="32" width="30" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <line x1="15" y1="34" x2="15" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="20" y1="34" x2="20" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="25" y1="34" x2="25" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="30" y1="34" x2="30" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="35" y1="34" x2="35" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Bottle Neck -->
      <rect x="15" y="56" width="20" height="15" fill="url(#bottle-amber)"/>
    </g>

    <!-- Bottle Amber Body -->
    <path d="M 65,71 Q 30,85 20,120 L 20,380 Q 20,400 45,405 L 105,405 Q 130,400 130,380 L 130,120 Q 120,85 85,71 Z" fill="url(#bottle-amber)" stroke="#271402" stroke-width="1.5"/>

    <!-- Specular Highlight on Amber Bottle (Glass Sheen) -->
    <path d="M 28,125 L 34,125 L 34,380 L 28,380 Z" fill="#FFFFFF" opacity="0.2"/>
    <path d="M 38,125 L 40,125 L 40,380 L 38,380 Z" fill="#FFFFFF" opacity="0.1"/>

    <!-- Bottle Label -->
    <g transform="translate(23, 130)">
      <rect x="0" y="0" width="104" height="225" rx="4" fill="#FFFDF8" stroke="#F1ECE0" stroke-width="1"/>
      <!-- Label Header Navy Strip -->
      <path d="M 0,0 L 104,0 L 104,36 Q 52,28 0,36 Z" fill="url(#navy-grad)"/>
      <text x="8" y="12" font-family="'Plus Jakarta Sans', Arial" font-size="6" font-weight="800" fill="#FF8A24">SUGAR FREE</text>
      <text x="96" y="12" text-anchor="end" font-family="'Plus Jakarta Sans', Arial" font-size="6" font-weight="800" fill="#FFD13B">100 ml</text>
      <text x="52" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="7" font-weight="800" fill="#FFFFFF">KIDS FORMULA</text>

      <!-- Label Brand Name -->
      <text x="52" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="15" font-weight="900" fill="#1B2A6B">Mangovita<tspan font-size="8" dy="-6">™</tspan></text>
      <!-- SYRUP Badge -->
      <rect x="26" y="68" width="52" height="14" rx="7" fill="url(#orange-badge)"/>
      <text x="52" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="8" font-weight="800" fill="#FFFFFF" letter-spacing="1">SYRUP</text>

      <!-- Label Mango graphic miniature -->
      <circle cx="52" cy="108" r="16" fill="#FEF3C7"/>
      <path d="M 50,96 C 60,96 66,104 64,115 C 62,123 52,128 44,124 C 38,120 38,110 42,102 C 45,97 48,96 50,96 Z" fill="url(#mango-yellow)"/>
      <path d="M 50,96 C 48,90 42,88 38,87 C 40,92 43,94 48,95 Z" fill="#2E7D32"/>

      <!-- Label Formula text -->
      <text x="52" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="6" font-weight="700" fill="#334155">Multivitamin &amp; Amino Acids</text>
      <text x="52" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="5.5" font-weight="600" fill="#64748B">with L-Lysine &amp; Zinc Gluconate</text>

      <!-- Key Benefits points on label -->
      <line x1="12" y1="156" x2="92" y2="156" stroke="#E2E8F0" stroke-width="1"/>
      <text x="52" y="167" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="5.5" font-weight="700" fill="#1B2A6B">GROWTH • IMMUNITY • APPETITE</text>
      <text x="52" y="177" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="5" font-weight="600" fill="#EA580C">Delicious Mango Flavour</text>

      <!-- Label Footer -->
      <rect x="0" y="195" width="104" height="30" fill="url(#navy-grad)"/>
      <text x="52" y="206" text-anchor="middle" font-family="Arial" font-size="5" font-weight="600" fill="#E2E8F0">Shake well before use</text>
      <text x="52" y="217" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial" font-size="6.5" font-weight="800" fill="#FFD13B">KENAS LABS</text>
    </g>
  </g>
</svg>
